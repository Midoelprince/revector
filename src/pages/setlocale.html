<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Request</title>
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  (function () {
    var m = /[?&]locale=([a-zA-Z-]+)/.exec(location.search);
    if (m) {
      // Same key i18n.js reads; only English and Arabic exist.
      try { localStorage.setItem("lang", m[1].toLowerCase() === "ar" ? "ar" : "en"); } catch (e) {}
      var back = document.referrer && document.referrer.indexOf(location.origin) === 0 ? document.referrer : "/";
      location.replace(back);
    }
  })();
</script>
</head>
<body class="bad">
<h1>Bad Request</h1>
<p>For request 'GET /setLocale' [Missing parameter: locale]</p>
</body>
</html>
