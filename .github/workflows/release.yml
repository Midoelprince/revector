# Builds the Windows installer and portable app and publishes them to GitHub Releases.
# Trigger: push a tag such as v1.1.0 (or create a release with a new tag in the GitHub UI).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - name: Make the app icon
        run: npm run icons

      - name: Build and publish
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The in-app updater asks GitHub for the "Latest" release, and a release created in the UI
      # does not always take that label, so installed apps would report "up to date".
      - name: Mark the release as Latest
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
